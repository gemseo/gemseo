[tool.towncrier]
directory = "changelog/fragments"
filename = "CHANGELOG.md"
template = "changelog/template.md"
title_format = "## Version {version} ({project_date})"
issue_format = "[#{issue}](https://gitlab.com/gemseo/dev/gemseo/-/issues/{issue})"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

# A breaking change is rendered first in the Changed section.
[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true
