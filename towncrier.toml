[tool.towncrier]
directory = "changelog/fragments"
filename = "CHANGELOG.md"
template = "changelog/template.md"
title_format = "## Version {version} ({project_date})"
issue_format = "[#{issue}](https://gitlab.com/gemseo/dev/gemseo/-/issues/{issue})"

# The name of a type is the singular label starting each item of the release notes,
# e.g. `- **Added** ...`; the template sorts the items by label.
# The directory of a type is the type of the fragment files: `<issue>.<type>.md`.
[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking change"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true
