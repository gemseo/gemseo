[project]
name = "gemseo"
authors = [{ name = "GEMSEO developers", email = "contact@gemseo.org" }]
description = "Generic Engine for Multi-disciplinary Scenarios, Exploration and Optimization"
readme = "README.md"
license = "LGPL-3.0"
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = ["version"]
requires-python = ">=3.10, <3.15"
dependencies = [
    "docstring-inheritance >=2.0.0,<=3.0.0",
    "fastjsonschema >=2.14.5,<=2.22.2",
    "genson >=1.2.2,<=1.4.0",
    "h5py >=3.6.0,<=3.16.0",
    "jinja2 >=3.0.0,<=3.1.6",
    "matplotlib >=3.10.1,<=3.11.1",
    "minisom >=2.3.6,<=2.3.6",
    "networkx >=2.5,<=3.6.1",
    "numpy >=1.24,<=2.4.6",
    "packaging >=15,<=26.3",
    "pandas >=2.2,<=2.3.3",
    "prettytable >=2.3.0,<=3.18.0",
    "pyxdsm >=2.2.1,<=2.3.2",
    "pydantic >=2.12,<=2.13.4",
    "pydantic-settings >=2.9.0,<=2.15.0",
    "requests >2,<3",
    "scipy >=1.15,<=1.17.1",
    "strenum >=0.4.9,<=0.4.15",
    "tqdm >=4.50,<=4.67.3",
    "typing-extensions >=4,<5",
    "xdsmjs >=1.0.0,<=2.0.0",
    "xxhash >=3.0.0,<=3.7.1",
]

[project.optional-dependencies]
all = [
    # Graphviz requires the dot executable.
    "graphviz >=0.19,<=0.21",
    "nlopt >=2.7.0,<=2.11.0",
    # For pandas excel reader.
    "openpyxl >=3.1,<=3.1.5",
    "openturns >=1.26,<=1.27.post1",
    "pillow >=9.5.0,<=12.3.0",
    "plotly >=6.0.0,<=6.9.0",
    "pydoe>=1.0.0,<=1.5.0",
    "scikit-learn >=1.5,<=1.9.0",
    "spgl1 >=0.0.3,<= 1.0.0",
    "sympy >=1.5,<=1.14.0",
]

[dependency-groups]
dev = [
    { include-group = "check" },
    { include-group = "test" },
]
# Lower bounds are necessary for testing the lowest bounds of the dependencies.
test = [
    "covdefaults >=2.3.0",
    "pandera >=0.20",
    "pytest >=8,<10",
    "pytest-cov >=5",
    "pytest-xdist >=3.6",
    "pytest-sugar >=1",
    "syrupy-matplotlib >=0.3.0",
    "syrupy >=4.7",
    "diff-cover>=10.4,<11",
]
doc = [
    "black",
    "click",
    "griffe-fieldz",
    "griffe-inherited-docstrings",
    "markdown-exec[ansi]",
    "mike",
    "mkdocs <2",
    "mkdocs-bibtex",
    "mkdocs-gallery",
    "mkdocs-gen-files",
    "mkdocs-include-markdown-plugin",
    "mkdocs-literate-nav",
    "mkdocs-macros-plugin",
    "mkdocs-material",
    "mkdocs-section-index",
    "mkdocstrings[python]",
    "mkdocs-autorefs",
    "mkdocs-minify-plugin",
    # For supporting DataFrame in pydantic models in an example.
    "pandera",
]
check = [
    # "just",
    "prek",
    "ruff",
]
dist = [
    "check-wheel-contents",
]
typing = [
    # Lower bound is necessary for testing the lowest bounds of dependencies.
    "mypy[reports] >=1.11",
    "pandas-stubs",
    "types-tqdm",
]

[project.urls]
Homepage = "https://gemseo.org"
Documentation = "https://gemseo.readthedocs.io"
Source = "https://gitlab.com/gemseo/dev/gemseo"
Issues = "https://gitlab.com/gemseo/dev/gemseo/-/issues"

[project.scripts]
gemseo-study = "gemseo.util.study_analysis.study_analysis_cli:main"
gemseo-deserialize-run = "gemseo.util.deserialize_and_run:main"

[build-system]
requires = [
    "setuptools",
    "setuptools_scm[toml]",
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.uv]
# The project version is derived from the git state by setuptools-scm,
# add that state to the default cache key so that uv rebuilds the project
# when the commit or the tags change.
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]
