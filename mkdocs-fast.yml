# Generated by docs/_scripts/prebuild.py, which must run before the build.
INHERIT: _docs/generated.yml

site_name: GEMSEO
site_description: GEMSEO is an open-source Python software to automate multidisciplinary processes.
site_url: https://gemseo.gitlab.io/dev/gemseo/
copyright: Copyright &copy; 2026 IRT Saint Exupéry

theme:
  custom_dir: docs/overrides
  favicon: assets/images/gemseo/small_monogram.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.path
    - navigation.prune
  logo: assets/images/gemseo/gemseo_logo_transparent.svg
  name: material
  # Keep the look of Material for MkDocs on which the custom CSS and overrides rely.
  variant: classic
  palette:
    - media: "(prefers-color-scheme)"
      # Only for the first paint: base.html renders the body tag from the first palette
      # entry and defaults a missing primary to indigo, while bundle.js, which copies the
      # colors of the matching light or dark entry onto this one, runs at the end of the
      # body. Without this the header flashes indigo before turning white or black.
      primary: white
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  autorefs: { }
  mike:
    canonical_version: latest
    # Gitlab pages expects the docs in this directory.
    deploy_prefix: public
  search: { }

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  # Replace the [@key] citations by footnotes (the mkdocs-bibtex plugin is not supported by Zensical).
  - docs_tools.bibtex_citations:
      bib_file: docs/references.bib

extra_css:
  - assets/css/style.css
  - assets/css/header.css
  - assets/css/fontello.css
  - assets/css/xdsmjs.css
  - assets/css/home.css
  - assets/css/reading-time.css
  - assets/css/complexity.css
  # The stylesheets of the gallery, copied by the docs-tools prebuild.
  - css/gallery/gallery.css
  - css/gallery/sg_gallery.css
  - css/gallery/sg_gallery-binder.css
  - css/gallery/sg_gallery-dataframe.css
  - css/gallery/sg_gallery-rendered-html.css
  - assets/css/footer.css

extra_javascript:
  # The home page panel is rendered by home.js, so it comes first: behind
  # xdsmjs.js it waited for 110 kB of a library the home page never uses.
  - assets/js/home.js
  - assets/js/legacy-versions.js
  - assets/js/version-selector.js
  # MathJax itself is not listed here; mathjax.js fetches it on the pages that
  # do have formulas.
  - assets/js/mathjax.js
  # Only a few example pages draw an XDSM; they bootstrap it from an inline
  # `DOMContentLoaded` listener, which deferring this library still precedes.
  - path: assets/js/xdsmjs.js
    defer: true

watch:
  - src/gemseo
  - README.md
  - CHANGELOG.md
  - nav.yml

extra:
  # Text shown next to the logo in the header. Set explicitly because the fallback in
  # overrides/partials/header.html leaves it empty for the core site name, matching the
  # suffix-less logo bar of gemseo.org.
  logo_suffix: gemseo
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/gemseo/dev/gemseo
      name: GEMSEO on GitLab
    - icon: simple/pypi
      link: https://pypi.org/project/gemseo/
      name: GEMSEO on PyPI
    - icon: fontawesome/brands/discourse
      link: https://gemseo.discourse.group/
      name: GEMSEO on Discourse
