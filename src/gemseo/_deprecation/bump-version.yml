# Renamed module-level names: classes, functions and variables, and the removed ones,
# with no replacement (`null`) or to replace by hand (`TODO <text>`). NOT the content of
# classes (their attributes and methods) — see the `classes` section.
#
# Same syntax as `modules:` above: the value is the complete new dotted path, or else
# `null` or `TODO <text>`. Keep an entry here rather than in `modules:` even when its
# module is renamed too: the two sections are what tells a renamed submodule apart from
# a renamed module-level function, both being lower-snake-case. The key still uses
# the OLD (6.3.2) path of the module defining the attribute, whatever the rename
# of that module, since `attributes:` rules are applied before `modules:` rules.

