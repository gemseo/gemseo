  #### Misc
  BaseSettings:
    _TARGET_CLASS_NAME: null
    # The target class name is now derived from the name of the settings class,
    # X_Settings targeting X; see target_class_name.
  PCERegressor_Settings:
    __init__:
      probability_space: null
  BaseDOE:
    generate_samples:
      n_samples: null

  # Scenario
  MDOScenario: &scenario-class
    design_space: design_space
    __init__:
      # The objective is now set by add_objective, called on the scenario right after
      # the statement creating it (or marked with a TODO when the scenario is not
      # assigned to a name). The rule also takes maximize_objective out of the call,
      # since its template names it, and carries it into add_objective.
      objective_name: add_objective(output_names={objective_name}, minimize=not {maximize_objective})
      formulation_settings_model: formulation_settings
      formulation_name: formulation_settings={formulation_name}_Settings(**{formulation_settings})
  DOEScenario: *scenario-class
  OptAsMDOScenario: *scenario-class
  MDOScenarioAdapter: &scenario-adapter-class
    keep_opt_history: keep_databases
    save_opt_history: save_databases
    LOWER_BND_SUFFIX: lower_bnd_suffix
    UPPER_BND_SUFFIX: upper_bnd_suffix
    MULTIPLIER_SUFFIX: multiplier_suffix
    DEFAULT_DATABASE_FILE_PREFIX: default_database_file_prefix
    __init__:
      reset_x0_before_opt: reset_x0_before_exec
      set_x0_before_opt: set_x0_before_exec
      set_bounds_before_opt: set_bounds_before_exec
      keep_opt_history: keep_databases
      save_opt_history: save_databases
      opt_history_file_prefix: database_file_prefix
  MDOObjectiveScenarioAdapter: *scenario-adapter-class
  # Only the classes that may hold a RandomSpace rename design_space to
  # input_space. MDOScenario and OptimizationProblem keep design_space, typed
  # DesignSpace: the codemod applies the rules of a class to its subclasses, so
  # their identity entries (design_space: design_space) stop the renames below
  # from churning user code that is already correct.
  BaseScenario:
    design_space: input_space
    DifferentiationMethod.USER_GRAD: DifferentiationMethod.USER
    _ALGO_FACTORY_CLASS: _algo_factory_class
    # BaseScenario alone defines save_optimization_history,
    # set_optimization_history_backup, clear_history_before_execute, execute,
    # set_algorithm and post_process, which MDOScenario, DOEScenario and
    # OptAsMDOScenario inherit, and create_scenario returns a BaseScenario: a rule on
    # a subclass would miss the scenario it returns.
    save_optimization_history: to_hdf
    set_optimization_history_backup: set_backup_settings
    clear_history_before_execute: clear_database_before_execute
    __init__:
      design_space: input_space
    execute:
      algo_settings_model: algorithm_settings
      algo_name: algorithm_settings={algo_name}_Settings(**{algo_settings})
    set_algorithm:
      algo_settings_model: algorithm_settings
      algo_name: algorithm_settings={algo_name}_Settings(**{algo_settings})
    # The post-processor name and the keywords **settings catches go to
    # settings=<post_name>_Settings(...), when the name is a string literal.
    # BasePost.execute and BaseAlgorithmLibrary.execute take no post_name, hence
    # their own settings_model block (&settings-model).
    post_process:
      settings_model: settings
      post_name: settings={post_name}_Settings(**{settings})

  # Algos
  AlgorithmDescription:
    Settings: settings_class
    __init__:
      Settings: settings_class
  DriverDescription:
    Settings: settings_class
  DOEAlgorithmDescription:
    Settings: settings_class
  OptimizationAlgorithmDescription:
    Settings: settings_class
  LinearSolverDescription:
    Settings: settings_class
  ODESolverDescription:
    Settings: settings_class
  BaseAlgoFactory:
    algo_names_to_libraries: algo_name_to_library
    _CLASS: _class
    _PACKAGE_NAMES: _package_names
    execute:
      settings_model: settings
      # The algorithm name and the keywords **settings catches go to
      # settings=<algo_name>_Settings(...), when the name is a string literal.
      algo_name: settings={algo_name}_Settings(**{settings})
  BaseAlgorithmLibrary:
    execute: &settings-model
      settings_model: settings
    # The settings to exclude are now the class attributes _settings_class_to_exclude
    # and _additional_settings_classes_to_exclude. Their defaults are what the 6.3.2
    # calls of the optimization, linear solver, ODE and pyDOE libraries excluded;
    # another library, e.g. one deriving from BaseDOELibrary, must set
    # _settings_class_to_exclude itself, and a settings mapping other than
    # self._settings.model_dump() is lost.
    _filter_settings:
      settings: null
      model_to_exclude: null
  BaseDriverLibrary:
    DifferentiationMethod.USER_GRAD: DifferentiationMethod.USER
    _RESULT_CLASS: _result_class
    _SUPPORT_SPARSE_JACOBIAN: _support_sparse_jacobian
    execute:
      # These two became fields of BaseDriverSettings; renaming them rather than
      # dropping them keeps the value, and the call then fails loudly, as execute
      # no longer takes loose settings, instead of silently ignoring it.
      eval_obs_jac: evaluate_observable_jacobian
      max_design_space_dimension_to_log: max_input_space_dimension_to_log
      # skipping the integer check has no equivalent any more, since relaxing
      # evaluates non-integral points instead.
      skip_int_check: null
      settings_model: settings
  BaseDriverSettings:
    round_ints: null
    # the rounding at every evaluation no longer exists.
    __init__:
      # The execute arguments of the 6.3.2 driver libraries that became settings, for
      # the loose settings of a factory call gathered into a settings model.
      eval_obs_jac: evaluate_observable_jacobian
      max_design_space_dimension_to_log: max_input_space_dimension_to_log
      skip_int_check: null
  BaseDOELibrary:
    _USE_UNIT_HYPERCUBE: _use_unit_hypercube
    compute_doe:
      __name__: sample_space
      variables_space: space
      unit_sampling: use_unit_samples
      settings_model: settings
  EvaluationProblem:
    design_space: input_space
    DifferentiationMethod.USER_GRAD: DifferentiationMethod.USER
    preprocess_functions: null
    # use EvaluationProblem.bind_functions to bind the functions to the database
    # and the counters, and EvaluationProblem.create_working_problem to derive a problem whose
    # functions work in the coordinates an algorithm manipulates.
    __init__:
      design_space: input_space
    reset:
      design_space: input_space
      preprocessing: null
      # the functions are rebuilt by the next call to bind_functions, so there
      # is nothing left to undo.
    evaluate_functions:
      design_vector: input_value
      design_vector_is_normalized: input_value_is_normalized
      preprocess_design_vector: preprocess_input_value

  # Formulation
  BaseFormulation:
    Settings: settings_class
    DEFAULT_SCENARIO_RESULT_CLASS_NAME: default_scenario_result_class_name
    optimization_problem: problem
    design_space: input_space
    _update_design_space: _update_input_space
    __init__:
      # The arguments are kept, and the call marked with this TODO.
      objective_name: &formulation-problem TODO pass the problem first, e.g. OptimizationProblem(design_space), then set its objective; the loose settings go into settings=<Formulation>_Settings(...)
      design_space: *formulation-problem
      minimize_objective: *formulation-problem
