# Configuration of the external codemod that upgrades user code to the new API.
# The `modules:` and `attributes:` sections below are also read at runtime by
# gemseo._deprecation to redirect imports of old names to their new location (which
# is why this file lives inside the package and is shipped with it). The old packages
# dissolved into several new ones are derived from `modules:`, not listed here.
# The `classes:` section is read at runtime too, but only its scalar entries (a
# class's own renamed attributes and methods, and the dotted renamed attributes of a
# class nested in it, e.g. `DifferentiationMethod.USER_GRAD: DifferentiationMethod.USER`
# for an enumeration member); the nested method-parameter blocks and the entries whose
# target is `null` remain codemod-only.

# The `modules:` and `attributes:` sections below share the same syntax: each entry
# is `old_qualified_name: new_qualified_name`, where the new value is always
# the COMPLETE dotted path of the new name — never relative, never a bare last
# segment — in gemseo or, for a name moved to a plugin, in the package of that plugin
# (gemseo_*); an `attributes:` value may also be in a third-party package, e.g.
# `scipy.sparse.sparray`. Both drive the import renamers: imports, and references to
# the imported names, are rewritten accordingly. A `null` value means that the old name
# was removed with no replacement: the codemod marks the code referring to it with a
# TODO comment (a later rule of its package still rewrites its path), and importing it
# raises an error saying so.
#
# A `TODO <text>` value means that the old name was removed and that its migration
# cannot be automated, e.g. because the new name alone does not preserve the behavior
# of the old one, or because which name replaces it depends on the use. `<text>` is an
# instruction telling how to migrate by hand: the codemod keeps the code referring to
# the name and marks it with `# TODO(bump-gemseo): <old name>: <text>` (a later rule of
# its package still rewrites its path). The runtime reads this value in `attributes:`
# only, where importing the name raises an ImportError ending with the text, `The
# attribute ... was removed; <text>.`, instead of resolving it: `<text>` thus reads
# after `<old name>: ` and before a period, e.g. `use x.y.New instead`. As the runtime
# reads this file line by line, `<text>` is on one line and, as a plain YAML scalar,
# contains no colon followed by a space and no ` #`.
#
# Each rule is applied exactly once: `attributes:` rules run first, then `modules:`
# rules, each section top to bottom. A name is rewritten by the first rule (top to
# bottom) whose key matches it in full or as a dotted prefix, so within `modules:`
# a nested (more specific) name's rule must precede its package's:
# modules:
#   x.y_old.z_old: x.y_new.z_new   # rename the submodule first
#   x.y_old: x.y_new                # then its package, for every other submodule
#
# No value may itself be matched by a LATER key of the same section (that would
# rewrite an already-final path a second time).
#
# Keys are 6.3.2 names: `modules:` keys are renamed modules and packages, NOT the
# names they define — see `attributes:`.
#
# An `attributes:` key outside GEMSEO and its plugins (e.g. `strenum.StrEnum`, a
# third-party name gemseo 6.3.2 required) is for the codemod only: the runtime never
# sees the old name, since it only redirects the `gemseo` modules.
#
# Some public 6.3.2 names are mapped to a private target (a path with a segment
# starting with `_`, e.g. gemseo.post._engine.colormap): this is deliberate, for the
# plugins that used these names, which may rely on private API.

modules:
  # Private modules and packages, which the plugins may import.
  gemseo.algos.doe.openturns._algos: gemseo.doe.openturns._algorithm
  gemseo.algos.opt.mnbi._utils: gemseo.optimization.mnbi._util
