  # Made private (_study_analysis_types), hence removed from the public API.
  # A null target cannot be enabled here yet: the runtime alias table is read
  # from this section, and test_every_rename_entry_is_reachable requires every
  # entry to resolve with getattr, which a removal cannot do.
  # gemseo.utils.study_analyses.study_analysis_cli.STUDY_ANALYSIS_TYPES: null

# Old packages that were entirely dissolved into several new packages, i.e. that have
# no rename of their own but whose submodules are spread over the new locations listed
# in `modules:`. gemseo._deprecation reads them to resolve an attribute access on the
# old package itself; the codemod needs no such entry, as the `modules:` entries of the
# submodules already cover the rewriting.

dissolved:
  - gemseo.settings

# Old module-level names whose migration cannot be automated, because the new name
# alone does not preserve the behavior of the old one. Each entry is
# `old_qualified_name: how to migrate`, the value being free text without any colon.
# gemseo._deprecation raises an ImportError carrying that text instead of resolving the
# `attributes:` entry of the same name, which is kept so that the codemod still renames
# the class; the user then has to complete the migration by hand.

manual:
  gemseo.disciplines.scenario_adapters.mdo_objective_scenario_adapter.MDOObjectiveScenarioAdapter: gemseo.scenario.adapter.mdo.MDOScenarioAdapter with output_optimal_objective=True

