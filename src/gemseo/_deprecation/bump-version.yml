    normed_residual: normalized_residual_norm
    check_jacobian: null
    # TODO: use gemseo.util.derivative.check.mda.MDAJacobianChecker instead.
    # The keywords **settings catches go to settings=<the MDA class>_Settings(...).
    # Every MDA class redefines __init__, which stops the lookup of its base classes'
    # rules at a constructor call, so each one repeats them.
    __init__: &mda-init
      settings_model: settings
      settings: settings={__class__}_Settings
  MDAGaussSeidel:
    __init__: *mda-init
  MDAJacobi:
    __init__: *mda-init
  MDANewtonRaphson:
    __init__: *mda-init
  MDAGSNewton:
    __init__: *mda-init
  BaseMDASettings:
    linear_solver: null
    linear_solver_tolerance: null
    __init__:
      # The name of a sub-algorithm and its settings are now one settings model, e.g.
      # linear_solver="GMRES", linear_solver_settings={"rtol": 1e-8} becomes
      # linear_solver_settings=GMRES_Settings(rtol=1e-8). A settings class whose own
      # __init__ rules shadow these ones repeats them.
      linear_solver: &linear-solver-settings linear_solver_settings={linear_solver}_Settings(**{linear_solver_settings})
  BaseMDASolver:
    Settings: settings_class
    add_iteration_callback:
