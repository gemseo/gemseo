# Configuration of the external codemod that upgrades user code to the new API.
# The `modules:`, `attributes:`, `dissolved:` and `manual:` sections below are also
# read at runtime by gemseo._deprecation to redirect imports of old names to their new
# location (which is why this file lives inside the package and is shipped with it).
# The `classes:` section is read at runtime too, but only its scalar entries (a
# class's own renamed attributes and methods); the nested method-parameter blocks
# and the entries whose target is `null` remain codemod-only.

# JSON dump of the old API (produced by `griffe dump`), giving old function
# signatures so parameter configs can use names instead of raw positions.
# A relative path is resolved against this config file's directory.
griffe_dump: ../../../griffe-dump.json

# The `modules:` and `attributes:` sections below share the same syntax: each entry
# is `old_qualified_name: new_name`, where the new value replaces the LAST segment
# of the old name (the rest of the path is kept) unless the new value is itself a
# dotted path (then the whole tail is replaced). Both drive the import renamers:
# imports, and references to the imported names, are rewritten accordingly.
#
# `attributes:` is applied before `modules:`, so the key of an attribute entry uses
# the OLD path of the module defining it, whatever the rename of that module.
#
# Renamed modules and packages, NOT the names they define — see `attributes:`.
#
# Order matters within the section: renamings are applied top to bottom, so rename
# the nested-most name first:
# modules:
#   x.y_old.z_old: z_new        # rename the submodule (last segment only)
#   x.y_old: y_new              # then rename its package (-> x.y_new.z_new)
#
# Add nesting (x.y -> x.y.z) by giving a dotted new value:
# modules:
#   x.y: y.z
#
# Move and/or rename across packages by giving the full new import path:
# modules:
#   x.y.z: x.a.b

