# Old packages that were entirely dissolved into several new packages, i.e. that have
# no rename of their own but whose submodules are spread over the new locations listed
# in `modules:`. gemseo._deprecation reads them to resolve an attribute access on the
# old package itself; the codemod needs no such entry, as the `modules:` entries of the
# submodules already cover the rewriting.

