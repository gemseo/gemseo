  gemseo.post.dataset.plots._matplotlib.scatter_plot_matrix: gemseo.post.dataset.plot._matplotlib.pair_plot

  # Modules moved to a plugin: the new path is in the package of the plugin, which
  # the migrated code then requires, and importing the old path without it raises an
  # error naming the plugin.
  gemseo.disciplines.wrappers.xls_discipline: gemseo_excel.xls_discipline

