  #### DataType (renamed VariableType, see attributes:)
  # N.B. SobieskiBase.DataType is an unrelated enumeration of NumPy dtypes
  # that also has a FLOAT member; it declares no REAL and its FLOAT is still
  # live, so the guards of the installer leave it alone.
  DataType:
    FLOAT: REAL

  #### DesignSpace
  DesignSpace:
    VARIABLE_TYPES_TO_DTYPES: variable_types_to_dtypes
    # The shortcuts to the variables of the space were removed; a design space
    # is read through its variables view, like a random space.
    variable_names: null
    # TODO: use list(space.variables) instead.
    variable_sizes: null
    # TODO: use {n: v.size for n, v in space.variables.items()} instead.
    variable_types: null
    # TODO: use {n: v.type for n, v in space.variables.items()} instead.
    names_to_indices: null
    # TODO: use space.variables.name_to_indices instead.
    get_size: null
    # TODO: use space.variables[name].size instead.
    get_type: null
    # TODO: use space.variables[name].type instead.
    get_lower_bound: null
    # TODO: use space.variables[name].lower_bound instead.
    get_upper_bound: null
    # TODO: use space.variables[name].upper_bound instead.
    has_integer_variables: null
    # TODO: use space.variables.has_variables_of_type(VariableType.INTEGER) instead.
    to_csv:
      header_char: null
    get_variables_indexes:
      use_design_space_order: use_space_order
    convert_dict_to_array:
      design_values: variable_values
  SellarDesignSpace:
    __init__:
      dtype: null

  #### ParameterSpace
  # The class is renamed to RandomSpace (see attributes:). A space no longer mixes
  # deterministic and random variables, so the members below either moved to the
  # variables view, belong to DesignSpace only, or have no equivalent at all.
  ParameterSpace:
    add_random_variable:
      __name__: add_variable
      # There is one distribution settings model per component now, so a variable
      # of size n is added with add_variable(name, *[settings] * n). The old
      # arguments cannot be rewritten mechanically: distribution was the name of a
      # distribution and its parameters were passed apart.
      distribution: null
      size: null
      interfaced_distribution: null
      interfaced_distribution_parameters: null
    add_random_vector:
      __name__: add_variable
      # Same restructuring as add_random_variable.
      distribution: null
      size: null
      interfaced_distribution: null
      interfaced_distribution_parameters: null
    distribution: null
    # TODO: use space.variables.distribution instead.
    distributions: null
    # TODO: use space.variables[name].distribution instead.
    uncertain_variables: null
    # TODO: use list(space.variables) instead.
    get_range: null
    # TODO: use space.variables[name].distribution.range instead.
    get_support: null
    # TODO: use space.variables[name].distribution.support instead.
    get_tabular_view: null
    # TODO: use get_pretty_table instead.
    build_joint_distribution: null
    # TODO: use add_copula, and read the joint distribution from space.variables.
    evaluate_cdf: null
    # TODO: use transform_vect and untransform_vect instead.
    normalize_vect: null
    unnormalize_vect: null
    add_variables_from: null
    # normalization and extension are DesignSpace notions.
    deterministic_variables: null
    is_deterministic: null
    is_uncertain: null
    extract_deterministic_space: null
    extract_uncertain_space: null
    to_design_space: null
    init_from_dataset: null
    # a space is either a DesignSpace or a RandomSpace, so there is nothing to
    # tell apart, extract or convert.

    # A ParameterSpace also inherited the whole DesignSpace API, which a
    # RandomSpace does not have. The members below therefore have no successor
    # either. N.B. add_variable is not listed: it exists on a RandomSpace but
    # adds a random variable from distribution settings, so a call that used to
    # add a deterministic variable must be reviewed by hand.
    to_file: null
    from_file: null
    to_hdf: null
    from_hdf: null
    to_csv: null
    from_csv: null
    # a random space has no file persistence; rebuild it from the settings of
    # the marginal probability distributions of its random variables.
    variable_names: null
    # TODO: use list(space.variables) instead.
    variable_sizes: null
    # TODO: use {n: v.size for n, v in space.variables.items()} instead.
    variable_types: null
    # TODO: use {n: v.type for n, v in space.variables.items()} instead.
    names_to_indices: null
    # TODO: use space.variables.name_to_indices instead.
    get_size: null
    # TODO: use space.variables[name].size instead.
    get_type: null
    # TODO: use space.variables[name].type instead.
    has_integer_variables: null
    # TODO: use space.variables.has_variables_of_type(VariableType.INTEGER) instead;
    # it is always False, as a random variable is of real type.
    has_current_value: null
    get_current_value: null
    set_current_value: null
    set_current_variable: null
    initialize_missing_current_values: null
    to_complex: null
    # TODO: a current value is a DesignSpace notion; use nominal_value to read the
    # reference point of a space, which is the mean of the distributions here.
    get_lower_bound: null
    get_upper_bound: null
    get_lower_bounds: null
    get_upper_bounds: null
    set_lower_bound: null
    set_upper_bound: null
    get_active_bounds: null
    check_membership: null
    project_into_bounds: null
    # bounds are a DesignSpace notion; the bounds of a random variable are the
    # limits of the support of its distribution and are read-only, through
    # space.variables[name].lower_bound and upper_bound.
    normalize_grad: null
    unnormalize_grad: null
    round_vect: null
    enable_integer_variables_normalization: null
    extend: null
    to_scalar_variables: null
    # normalization, integer rounding and extension are DesignSpace notions.
    get_variables_indexes:
      use_design_space_order: use_space_order
    convert_dict_to_array:
      design_values: variable_values

  # The argument parameter_space of the sampling methods of the sensitivity
  # analyses is renamed random_space, as these spaces are purely made of random variables.
