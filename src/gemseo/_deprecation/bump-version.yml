# are resolved from the old API signatures in the griffe dump, so a position is
# never needed to remove or locate an argument. Only give a position when the
# argument actually moves; drop it once the argument no longer needs repositioning.
# old_func_name:
#   old_arg_name: new_arg_name             # rename argument
#   old_arg_name: new_arg_name N           # rename and reposition to index N
#   old_arg_name: N                        # reposition only to index N (integer value)
#   old_arg_name: null                     # remove argument
#   old_arg_name: new_arg_name={old_arg}_Settings  # rename and wrap value in a Settings instance

