# How the packages of `develop` map to the ones of this branch, to rebase a branch
# created before the subpackage reorganization: rebase it, then rewrite the `develop`
# names left in its code with the table below (see REBASING.md).
#
# This file is meant to be read and applied directly, by an agent or a script. Every
# name on both sides is a COMPLETE dotted path, so no entry needs another one to be
# understood, and the order carries no meaning (they are sorted alphabetically).
#
# How to apply an entry:
#
# * `names:` — an entry `old.module.OldName: new.module.NewName` matches an import of
#   `OldName` from `old.module`, or an access `old.module.OldName`: import `NewName`
#   from `new.module` instead, and rename the identifier at its use sites. Such an entry
#   wins over any `modules:` entry matching the module part of its key.
# * `modules:` — for any other dotted name, i.e. the module of an `import` or of a
#   `from ... import ...`, or a path written in a docstring, a documentation page or an
#   entry point, take the LONGEST key that is the name itself or a prefix of it on a
#   segment boundary (`gemseo.algos` is a prefix of `gemseo.algos.doe`, not of
#   `gemseo.algosx`), and replace that prefix with the value of the entry.
#
# Apply a single entry to a name: a value is already the final name, never feed it back
# in. A name matching no entry is unchanged.
#
# Apart from `flatten_processes`, no public class attribute, method or signature was
# renamed between `develop` and this branch, so a rebase needs the names below and
# little else. Private internals did move though: a branch touching them has to
# reconcile its design with the one of this branch.
#
# `flatten_processes` (`get_sub_disciplines` on `develop`) renamed its first argument
# from `disciplines` to `processes`: a call passing it by keyword needs that rename on
# top of the `names:` entry. It also flattens any `EvaluationScenario`, where `develop`
# flattens an `MDOScenario` only and returns any other scenario as is. A branch relying
# on either of these has to account for the difference.
#
# The `gemseo.settings` package was dissolved into the packages of the settings it
# exposed; its modules are listed one by one and the package itself has no counterpart.
#
# Every old name below exists on `develop` and every new name exists on this branch,
# checked against both source trees; 207 modules and packages,
# 18 module-level names.

# Renamed and moved modules and packages.
