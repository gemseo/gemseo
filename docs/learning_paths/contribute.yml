# Learning path: contribute to GEMSEO.
# NOTE: the documentation currently has no dedicated "contributing" section, so
# these entries point to the closest in-doc pages (architecture) and to the
# GitLab project (absolute URLs) for the developer workflow. Replace with real
# contributing pages once they exist in the docs.
id: contribute
code: DEV
title: Contribute to GEMSEO
blurb: Extend the framework — solvers, plugins, code and documentation.

prerequisites:
  - title: Installation
    path: software/installation/

resources:
  - type: explanation
    title: Architecture principles
    desc: How the framework is organized before you extend it.
    path: software/system_architecture/
  - type: tutorial
    title: Set up a development environment
    desc: Clone, install in editable mode and run the tests.
    path: https://gitlab.com/gemseo/dev/gemseo/-/blob/develop/CONTRIBUTING.md
  - type: howto
    title: Follow the coding guidelines
    desc: Style, typing and pre-commit hooks.
    path: https://gitlab.com/gemseo/dev/gemseo/-/blob/develop/CONTRIBUTING.md
  - type: howto
    title: Submit a merge request
    desc: Branch, changelog entry and review workflow.
    path: https://gitlab.com/gemseo/dev/gemseo/-/merge_requests
  - type: howto
    title: Interface a new solver
    desc: Add support for an external optimization solver.
    path: software/system_architecture/
  - type: howto
    title: Create a GEMSEO plugin
    desc: Package new disciplines or algorithms as a plugin.
    path: https://gitlab.com/gemseo/dev
