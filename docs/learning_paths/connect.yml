# Learning path: connect a model.
# Schema: type in {explanation, tutorial, howto, reference}.
# `path` is relative to the documentation base URL (version-portable), or an
# absolute http(s) URL for external resources.
id: connect
code: DISC
title: Connect a model
blurb: Wrap your simulation code, solvers or functions as GEMSEO disciplines.

prerequisites:
  - title: Installation
    path: software/installation/

resources:
  - type: explanation
    title: What is a discipline?
    desc: The core building block of any GEMSEO study.
    path: user_guide/concepts/discipline/discipline/
  - type: tutorial
    title: Create your first discipline
    desc: Wrap a simple analytic model step by step.
    path: generated/examples/tutorials/basic/plot_tutorial_first_discipline/
  - type: howto
    title: Wrap a Python function
    desc: Turn an existing function into a discipline.
    path: generated/examples/howtos/disciplines/
  - type: howto
    title: Interface an external executable
    desc: Drive a black-box solver from disk I/O.
    path: generated/examples/tutorials/basic/plot_tutorial_discipline_executable/
  - type: explanation
    title: Grammars & data flow
    desc: How inputs/outputs are typed and validated.
    path: user_guide/needs/data_validation_persistence/
  - type: reference
    title: Discipline API
    desc: Full reference for the disciplines and their settings.
    path: algorithms/discipline_algos/
